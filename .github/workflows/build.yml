name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair projeto
        run: |
          unzip VoceTemUmReal-Android.zip -d projeto
          cd projeto/VoceTemUmReal
          chmod +x gradlew || true

      - name: Compilar APK
        run: |
          cd projeto/VoceTemUmReal
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: VoceTemUmReal-APK
          path: projeto/VoceTemUmReal/app/build/outputs/apk/debug/*.apk
